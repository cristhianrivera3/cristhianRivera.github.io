<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cristhian Rivera | Ethical Hacker & Red Team</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0f;
        }
        
        /* Contenedor que ocupa toda la pantalla */
        .fullscreen-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0f;
            padding: 10px;
        }
        
        /* Iframe que ocupa todo el espacio disponible */
        .fullscreen-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
            box-shadow: 0 0 60px rgba(139, 92, 246, 0.15);
        }
        
        /* Botón flotante para volver (opcional) */
        .back-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 15, 35, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid #3b2a5a;
            color: #c4b5fd;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.3s ease;
            z-index: 1000;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .back-btn:hover {
            background: rgba(139, 92, 246, 0.2);
            border-color: #a855f7;
            color: #e9d5ff;
            transform: translateX(-50%) scale(1.05);
        }
        
        /* Responsive */
        @media (max-width: 700px) {
            .fullscreen-container {
                padding: 5px;
            }
            .fullscreen-container iframe {
                border-radius: 8px;
            }
            .back-btn {
                bottom: 20px;
                padding: 8px 18px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    
    <!-- Contenedor fullscreen -->
    <div class="fullscreen-container">
        <iframe 
            loading="lazy"
            src="https://www.canva.com/design/DAHUom2JYcw/GJbC2yVkgE0rRzzWeSgw_A/view?embed" 
            allowfullscreen="allowfullscreen" 
            allow="fullscreen">
        </iframe>
    </div>
    
    <!-- Botón flotante para volver a tu portafolio (opcional) -->
    <a href="https://cristhianrivera3.github.io" class="back-btn" target="_blank">
        ← Volver al portafolio
    </a>
    
</body>
</html>
